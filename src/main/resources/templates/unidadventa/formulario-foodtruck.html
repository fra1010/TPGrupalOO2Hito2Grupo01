<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    Mismo formato que form.html: el head (Bootstrap, CSS propio, title), la navbar,
    el footer y los scripts vienen del layout, por eso esta vista no los define.
-->
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">

    <!-- page-header: clase propia del proyecto, igual que en las otras paginas -->
    <div class="page-header">
        <h2>Food Truck</h2>
    </div>

    <!-- card form-card: contenedor de formularios del proyecto -->
    <div class="card form-card">
        <div class="card-body">

            <form th:action="@{/unidadVenta/nuevafoodtruck}"
                  th:object="${foodTruckDTO}"
                  method="post">

                <!-- ==================================================== -->
                <!-- RESUMEN DE ERRORES (opcional pero recomendado)        -->
                <!-- th:if evita mostrar el bloque si no hay errores       -->
                <!-- alert alert-danger: caja roja de Bootstrap            -->
                <!-- ==================================================== -->
                <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                    <p class="mb-2"><strong>Corregí los siguientes errores:</strong></p>
                    <ul class="mb-0">
                        <!-- th:each recorre TODOS los errores del formulario -->
                        <li th:each="err : ${#fields.allErrors()}"
                            th:text="${err}">mensaje de error</li>
                    </ul>
                </div>

                <!-- ==================================================== -->
                <!-- CAMPOS COMUNES (UnidadVentaDTO)                       -->
                <!-- Cada campo: div.mb-3 > label.col-form-label +         -->
                <!-- input.form-control + div.text-danger (error)          -->
                <!-- ==================================================== -->

                <input type="hidden" th:field="*{idUnidadVenta}">

                <!-- NOMBRE: @NotBlank -->
                <div class="mb-3">
                    <label for="nombre" class="col-form-label">Nombre: *</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}">
                    <!-- th:errors muestra el mensaje de @NotBlank si falla -->
                    <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <!-- SUPERFICIE: @NotNull @Positive (Double) -->
                <div class="mb-3">
                    <label for="superficie" class="col-form-label">Superficie (m²): *</label>
                    <input type="number" step="0.01" min="0.01" class="form-control"
                           id="superficie" th:field="*{superficie}">
                    <div class="text-danger" th:if="${#fields.hasErrors('superficie')}" th:errors="*{superficie}"></div>
                </div>

                <!-- CÓDIGO: @NotBlank @Size(max=45) -->
                <div class="mb-3">
                    <label for="codigo" class="col-form-label">Código: *</label>
                    <!-- maxlength=45 refleja el @Size(max = 45) del DTO -->
                    <input type="text" class="form-control" id="codigo" maxlength="45" th:field="*{codigo}">
                    <div class="text-danger" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
                </div>

                <!-- FESTIVAL: Integer, sin validación -->
                <div class="mb-3">
                    <label for="idFestival" class="col-form-label">ID Festival:</label>
                    <input type="number" class="form-control" id="idFestival" th:field="*{idFestival}">
                </div>

                <!-- ==================================================== -->
                <!-- RESPONSABLE (UserDTO anidado)                         -->
                <!-- @Valid en el DTO padre propaga la validación aquí     -->
                <!-- ==================================================== -->
                <h5 class="mt-4 mb-3">Responsable</h5>

                <!-- USERNAME: @NotBlank @Size(max=45) -->
                <div class="mb-3">
                    <label for="responsable.username" class="col-form-label">Usuario: *</label>
                    <input type="text" class="form-control" id="responsable.username"
                           maxlength="45"
                           th:field="*{responsable.username}">
                    <div class="text-danger" th:if="${#fields.hasErrors('responsable.username')}" th:errors="*{responsable.username}"></div>
                </div>

                <!-- PASSWORD: @NotBlank @Size(min=6, max=72) -->
                <div class="mb-3">
                    <label for="responsable.password" class="col-form-label">Clave: *</label>
                    <!-- minlength/maxlength reflejan el @Size del DTO -->
                    <input type="password" class="form-control" id="responsable.password"
                           minlength="6" maxlength="72"
                           th:field="*{responsable.password}">
                    <div class="text-danger" th:if="${#fields.hasErrors('responsable.password')}" th:errors="*{responsable.password}"></div>
                </div>

                <!-- ==================================================== -->
                <!-- CAMPOS ESPECÍFICOS DE FoodTruckDTO                    -->
                <!-- ==================================================== -->
                <h5 class="mt-4 mb-3">Datos del food truck</h5>

                <!-- PATENTE: @NotBlank -->
                <div class="mb-3">
                    <label for="patente" class="col-form-label">Patente: *</label>
                    <input type="text" class="form-control" id="patente" th:field="*{patente}">
                    <div class="text-danger" th:if="${#fields.hasErrors('patente')}" th:errors="*{patente}"></div>
                </div>

                <!-- CONEXIÓN: boolean, sin validación -->
                <!-- form-check / form-check-input / form-check-label: estilo de Bootstrap para checkbox -->
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="conexion" th:field="*{conexion}">
                    <label for="conexion" class="form-check-label">Conexión eléctrica</label>
                </div>

                <!-- BOTÓN: mismo contenedor d-flex y botón btn-success que form.html -->
                <div class="d-flex">
                    <button type="submit" class="btn btn-success">Guardar</button>
                </div>
            </form>

        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
