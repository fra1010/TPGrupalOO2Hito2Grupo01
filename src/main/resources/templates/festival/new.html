<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
    <title>Nuevo festival</title>
</head>

<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4"
      style="max-width: 900px; margin-top: 70px;">

    <div class="page-header mb-4 d-flex flex-wrap
                justify-content-between align-items-center">

        <div class="mb-2">
            <h2>Nuevo festival</h2>

            <p class="text-muted mb-0">
                Completá los datos del festival y su configuración de costos.
            </p>
        </div>

        <a th:href="@{/}"
           class="btn btn-outline-secondary mb-2">
            Volver al inicio
        </a>

    </div>

    <form th:action="@{/festival/create}"
          th:object="${festival}"
          method="post">

        <!-- Errores generales -->
        <div th:if="${#fields.hasGlobalErrors()}"
             class="alert alert-danger">
            <p class="mb-0"
               th:each="error : ${#fields.globalErrors()}"
               th:text="${error}">
            </p>
        </div>

        <!-- Datos del festival -->
        <div class="card shadow-sm mb-4">

            <div class="card-header">
                Datos del festival
            </div>

            <div class="card-body">

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text"
                           class="form-control"
                           id="nombre"
                           th:field="*{nombre}"
                           required>

                    <small class="text-danger"
                           th:if="${#fields.hasErrors('nombre')}"
                           th:errors="*{nombre}">
                    </small>
                </div>

                <div class="form-group">
                    <label for="temporada">Temporada</label>
                    <input type="text"
                           class="form-control"
                           id="temporada"
                           th:field="*{temporada}"
                           required>

                    <small class="text-danger"
                           th:if="${#fields.hasErrors('temporada')}"
                           th:errors="*{temporada}">
                    </small>
                </div>

                <div class="form-row">

                    <div class="form-group col-md-6">
                        <label for="fechaInicio">Fecha de inicio</label>
                        <input type="date"
                               class="form-control"
                               id="fechaInicio"
                               th:field="*{fechaInicio}"
                               required>

                        <small class="text-danger"
                               th:if="${#fields.hasErrors('fechaInicio')}"
                               th:errors="*{fechaInicio}">
                        </small>
                    </div>

                    <div class="form-group col-md-6">
                        <label for="fechaFin">Fecha de fin</label>
                        <input type="date"
                               class="form-control"
                               id="fechaFin"
                               th:field="*{fechaFin}"
                               required>

                        <small class="text-danger"
                               th:if="${#fields.hasErrors('fechaFin')}"
                               th:errors="*{fechaFin}">
                        </small>
                    </div>

                </div>

            </div>

        </div>

        <!-- Costos -->
        <div class="card shadow-sm mb-4">

            <div class="card-header">
                Costos del festival
            </div>

            <div class="card-body">

                <div class="form-row">

                    <div class="form-group col-md-6">
                        <label for="costoSuperficies">Costo por superficies</label>

                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">$</span>
                            </div>
                            <input type="number"
                                   class="form-control"
                                   id="costoSuperficies"
                                   step="0.01"
                                   min="0"
                                   th:field="*{costoSuperficies}"
                                   required>
                        </div>

                        <small class="text-danger"
                               th:if="${#fields.hasErrors('costoSuperficies')}"
                               th:errors="*{costoSuperficies}">
                        </small>
                    </div>

                    <div class="form-group col-md-6">
                        <label for="costoMontaje">Costo de montaje</label>

                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">$</span>
                            </div>
                            <input type="number"
                                   class="form-control"
                                   id="costoMontaje"
                                   step="0.01"
                                   min="0"
                                   th:field="*{costoMontaje}"
                                   required>
                        </div>

                        <small class="text-danger"
                               th:if="${#fields.hasErrors('costoMontaje')}"
                               th:errors="*{costoMontaje}">
                        </small>
                    </div>

                    <div class="form-group col-md-6">
                        <label for="plusElectricidad">Plus electricidad</label>

                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">$</span>
                            </div>
                            <input type="number"
                                   class="form-control"
                                   id="plusElectricidad"
                                   step="0.01"
                                   min="0"
                                   th:field="*{plusElectricidad}"
                                   required>
                        </div>

                        <small class="text-danger"
                               th:if="${#fields.hasErrors('plusElectricidad')}"
                               th:errors="*{plusElectricidad}">
                        </small>
                    </div>

                    <div class="form-group col-md-6">
                        <label for="sueldoBase">Sueldo base</label>

                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">$</span>
                            </div>
                            <input type="number"
                                   class="form-control"
                                   id="sueldoBase"
                                   step="0.01"
                                   min="0"
                                   th:field="*{sueldoBase}"
                                   required>
                        </div>

                        <small class="text-danger"
                               th:if="${#fields.hasErrors('sueldoBase')}"
                               th:errors="*{sueldoBase}">
                        </small>
                    </div>

                    <div class="form-group col-md-6">
                        <label for="plusAntiguedad">Plus antigüedad</label>

                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">$</span>
                            </div>
                            <input type="number"
                                   class="form-control"
                                   id="plusAntiguedad"
                                   step="0.01"
                                   min="0"
                                   th:field="*{plusAntiguedad}"
                                   required>
                        </div>

                        <small class="text-danger"
                               th:if="${#fields.hasErrors('plusAntiguedad')}"
                               th:errors="*{plusAntiguedad}">
                        </small>
                    </div>

                    <div class="form-group col-md-6">
                        <label for="plusCocinero">Plus cocinero</label>

                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">$</span>
                            </div>
                            <input type="number"
                                   class="form-control"
                                   id="plusCocinero"
                                   step="0.01"
                                   min="0"
                                   th:field="*{plusCocinero}"
                                   required>
                        </div>

                        <small class="text-danger"
                               th:if="${#fields.hasErrors('plusCocinero')}"
                               th:errors="*{plusCocinero}">
                        </small>
                    </div>

                    <div class="form-group col-md-6">
                        <label for="plusAyudante">Plus ayudante</label>

                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">$</span>
                            </div>
                            <input type="number"
                                   class="form-control"
                                   id="plusAyudante"
                                   step="0.01"
                                   min="0"
                                   th:field="*{plusAyudante}"
                                   required>
                        </div>

                        <small class="text-danger"
                               th:if="${#fields.hasErrors('plusAyudante')}"
                               th:errors="*{plusAyudante}">
                        </small>
                    </div>

                    <div class="form-group col-md-6">
                        <label for="plusLavaplatos">Plus lavaplatos</label>

                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">$</span>
                            </div>
                            <input type="number"
                                   class="form-control"
                                   id="plusLavaplatos"
                                   step="0.01"
                                   min="0"
                                   th:field="*{plusLavaplatos}"
                                   required>
                        </div>

                        <small class="text-danger"
                               th:if="${#fields.hasErrors('plusLavaplatos')}"
                               th:errors="*{plusLavaplatos}">
                        </small>
                    </div>

                </div>

            </div>

        </div>

        <!-- Acciones -->
        <div class="d-flex justify-content-end">

            <a th:href="@{/}"
               class="btn btn-outline-secondary mr-2">
                Cancelar
            </a>

            <button type="submit" class="btn btn-primary">
                Guardar festival
            </button>

        </div>

    </form>

</main>

<footer th:replace="~{layout :: footer}"></footer>

<div th:replace="~{layout :: scripts}"></div>

</body>
</html>
