<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<nav th:replace="~{layout :: navbarResponsable}"></nav>

<main class="container py-4">

    <h1 class="h3 mb-4 text-center">Reportes</h1>

    <!-- Tabs: el cambio de pestaña lo maneja el script de abajo, no Bootstrap -->
    <ul class="nav nav-tabs justify-content-center" id="reportesTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="canon-tab" type="button" role="tab"
                    aria-controls="canon-pane" aria-selected="true"
                    th:attr="data-url=@{/responsable/canon}">Canon</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="haberes-tab" type="button" role="tab"
                    aria-controls="haberes-pane" aria-selected="false"
                    th:attr="data-url=@{/responsable/haberes}">Haberes</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="recaudacion-tab" type="button" role="tab"
                    aria-controls="recaudacion-pane" aria-selected="false"
                    th:attr="data-url=@{/responsable/recaudacion}">Recaudación</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="rentabilidad-tab" type="button" role="tab"
                    aria-controls="rentabilidad-pane" aria-selected="false"
                    th:attr="data-url=@{/unidadVenta/rentabilidadneta}">Rentabilidad</button>
        </li>

    </ul>

    <!-- Contenido de cada tab (se carga la primera vez que se abre) -->
    <div class="tab-content border border-top-0 rounded-bottom p-3" id="reportesTabContent">
        <div class="tab-pane active" id="canon-pane" role="tabpanel"
             aria-labelledby="canon-tab" tabindex="0"></div>
        <div class="tab-pane" id="haberes-pane" role="tabpanel"
             aria-labelledby="haberes-tab" tabindex="0"></div>
        <div class="tab-pane" id="recaudacion-pane" role="tabpanel"
             aria-labelledby="recaudacion-tab" tabindex="0"></div>
        <div class="tab-pane" id="rentabilidad-pane" role="tabpanel"
             aria-labelledby="rentabilidad-tab" tabindex="0"></div>
        <div class="tab-pane" id="pedido-pane" role="tabpanel"
             aria-labelledby="pedido-tab" tabindex="0"></div>
    </div>

    <!-- Estados de carga y error -->
    <template id="tpl-cargando">
        <div class="text-center text-muted py-5">
            <div class="spinner-border" role="status"></div>
            <p class="mt-3 mb-0">Cargando reporte…</p>
        </div>
    </template>

    <template id="tpl-error">
        <div class="alert alert-warning mb-0">
            No se pudo cargar este reporte.
            <a class="alert-link" target="_blank" rel="noopener">Abrirlo en otra pestaña</a>
        </div>
    </template>

</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

<script>
    (function () {
        var tabs = Array.from(document.querySelectorAll('#reportesTab [data-url]'));

        function paneDe(tab) {
            return document.getElementById(tab.getAttribute('aria-controls'));
        }

        function plantilla(id) {
            return document.getElementById(id).content.cloneNode(true);
        }

        // Los scripts insertados con innerHTML no se ejecutan: se recrean para que corran.
        function activarScripts(contenedor) {
            contenedor.querySelectorAll('script').forEach(function (vieja) {
                var nueva = document.createElement('script');
                Array.from(vieja.attributes).forEach(function (a) {
                    nueva.setAttribute(a.name, a.value);
                });
                nueva.textContent = vieja.textContent;
                vieja.replaceWith(nueva);
            });
        }

        async function pedir(tab, url, opciones) {
            var pane = paneDe(tab);
            pane.replaceChildren(plantilla('tpl-cargando'));

            try {
                var res = await fetch(url, Object.assign({ credentials: 'same-origin' }, opciones));
                if (!res.ok) throw new Error('HTTP ' + res.status);

                var doc = new DOMParser().parseFromString(await res.text(), 'text/html');
                var main = doc.querySelector('main');
                if (!main) throw new Error('La página no tiene <main>');

                pane.innerHTML = main.innerHTML;
                pane.dataset.urlActual = res.url; // base para formularios sin action
                activarScripts(pane);
            } catch (e) {
                delete tab.dataset.loaded; // permite reintentar al volver a la pestaña
                var error = plantilla('tpl-error');
                error.querySelector('a').href = tab.dataset.url;
                pane.replaceChildren(error);
            }
        }

        function cargar(tab) {
            if (tab.dataset.loaded) return;
            tab.dataset.loaded = 'true';
            return pedir(tab, tab.dataset.url);
        }

        // Los formularios de cada reporte se envían por fetch y el resultado queda en el mismo tab
        document.getElementById('reportesTabContent').addEventListener('submit', function (e) {
            var form = e.target;
            var pane = form.closest('.tab-pane');
            if (!pane || (form.target && form.target !== '_self')) return;

            e.preventDefault();
            var tab = document.getElementById(pane.getAttribute('aria-labelledby'));
            var base = new URL(pane.dataset.urlActual || tab.dataset.url, location.href);
            var destino = new URL(form.getAttribute('action') || base.href, base);
            var datos = new FormData(form, e.submitter);
            var opciones = {};

            if (form.method === 'get') {
                destino.search = new URLSearchParams(datos).toString();
            } else {
                opciones.method = form.method.toUpperCase();
                opciones.body = form.enctype === 'multipart/form-data' ? datos : new URLSearchParams(datos);
            }
            pedir(tab, destino.href, opciones);
        });

        // Cambia de pestaña sin depender del JS de Bootstrap (sirve en Bootstrap 4 y 5)
        function mostrar(tab) {
            tabs.forEach(function (t) {
                var activa = (t === tab);
                t.classList.toggle('active', activa);
                t.setAttribute('aria-selected', activa ? 'true' : 'false');
                paneDe(t).classList.toggle('active', activa);
            });
            cargar(tab);
        }

        tabs.forEach(function (tab) {
            tab.addEventListener('click', function () { mostrar(tab); });
        });

        cargar(tabs[0]);
    })();
</script>

</body>
</html>
