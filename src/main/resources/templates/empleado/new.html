<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
    <title>Empleado — Epicentro Gourmet</title>
</head>

<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4" style="max-width: 700px;">

    <div class="page-header mb-3">
        <h2 th:text="${empleado.idEmpleado != null}
                     ? 'Editar Empleado' : 'Nuevo Empleado'">
            Nuevo Empleado
        </h2>
    </div>

    <!-- Alerta para mostrar errores informados por el controller -->
    <div th:if="${error != null}"
         class="alert alert-danger"
         role="alert"
         th:text="${error}">
    </div>

    <div class="card form-card shadow-sm">
        <div class="card-body">

            <form th:action="@{/empleado/create}"
                  th:object="${empleado}"
                  method="post">

                <!-- Campo oculto indispensable para procesar actualizaciones -->
                <input type="hidden" th:field="*{idEmpleado}"/>

                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        Nombre
                    </label>

                    <input type="text"
                           class="form-control"
                           id="nombre"
                           th:field="*{nombre}"
                           required
                           placeholder="Ingrese el nombre"/>
                </div>

                <div class="mb-3">
                    <label for="apellido" class="form-label">
                        Apellido
                    </label>

                    <input type="text"
                           class="form-control"
                           id="apellido"
                           th:field="*{apellido}"
                           required
                           placeholder="Ingrese el apellido"/>
                </div>

                <!-- Email y usuario de acceso -->
                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email / Usuario de acceso
                    </label>

                    <input type="email"
                           class="form-control"
                           id="email"
                           th:field="*{email}"
                           maxlength="45"
                           required
                           th:readonly="${empleado.idEmpleado != null}"
                           placeholder="empleado@ejemplo.com"/>

                    <small class="form-text text-muted">
                        En esta dirección se enviará su usuario y una
                        contraseña generada automáticamente.
                    </small>

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="dni" class="form-label">
                        DNI
                    </label>

                    <input type="number"
                           class="form-control"
                           id="dni"
                           th:field="*{dni}"
                           required
                           placeholder="Ingrese el DNI"/>
                </div>

                <div class="mb-3">
                    <label for="fechaNacimiento" class="form-label">
                        Fecha de Nacimiento
                    </label>

                    <input type="date"
                           class="form-control"
                           id="fechaNacimiento"
                           th:field="*{fechaNacimiento}"
                           required/>

                    <!-- Error por fecha vacía o formato incorrecto -->
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('fechaNacimiento')}"
                         th:errors="*{fechaNacimiento}">
                    </div>

                    <!-- Error de la validación de edad del DTO -->
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('mayorDeEdad')}"
                         th:errors="*{mayorDeEdad}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="ingreso" class="form-label">
                        Fecha de Ingreso
                    </label>

                    <input type="date"
                           class="form-control"
                           id="ingreso"
                           th:field="*{ingreso}"
                           required/>
                </div>

                <!-- Selector de tipo para herencia -->
                <div class="mb-3 border-top pt-3">
                    <label for="tipoEmpleado"
                           class="form-label fw-bold">
                        Tipo de Empleado
                    </label>

                    <select class="form-select form-control"
                            id="tipoEmpleado"
                            th:field="*{tipoEmpleado}"
                            required
                            onchange="toggleCamposEspecificos()">

                        <option value="">
                            -- Seleccione un tipo --
                        </option>

                        <option value="CAJERO">
                            Cajero
                        </option>

                        <option value="COCINERO">
                            Cocinero
                        </option>
                    </select>
                </div>

                <!-- Sección dinámica: Cajero -->
                <div id="seccionCajero"
                     style="display: none;"
                     class="mb-3 p-3 bg-light rounded">

                    <label for="turno" class="form-label">
                        Turno Asignado
                    </label>

                    <select class="form-select form-control"
                            id="turno"
                            th:field="*{turno}">

                        <option value="">
                            -- Seleccione Turno --
                        </option>

                        <option th:each="t : ${turnos}"
                                th:value="${t}"
                                th:text="${t}">
                        </option>
                    </select>
                </div>

                <!-- Sección dinámica: Cocinero -->
                <div id="seccionCocinero"
                     style="display: none;"
                     class="p-3 bg-light rounded mb-3">

                    <div class="mb-3">
                        <label for="categoria" class="form-label">
                            Categoría de Cocina
                        </label>

                        <select class="form-select form-control"
                                id="categoria"
                                th:field="*{categoria}">

                            <option value="">
                                -- Seleccione Categoría --
                            </option>

                            <option th:each="c : ${categorias}"
                                    th:value="${c}"
                                    th:text="${c}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="tareaEspecial" class="form-label">
                            Tarea Especial
                        </label>

                        <input type="text"
                               class="form-control"
                               id="tareaEspecial"
                               th:field="*{tareaEspecial}"
                               placeholder="Ej: Especialista en minutas"/>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="btn btn-primary">
                        Guardar Empleado
                    </button>

                    <a th:href="@{/empleado}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>
    </div>

</main>

<footer th:replace="~{layout :: footer}"></footer>

<div th:replace="~{layout :: scripts}"></div>

<script>
    function toggleCamposEspecificos() {
        var tipo = document.getElementById("tipoEmpleado").value;
        var cajero = document.getElementById("seccionCajero");
        var cocinero = document.getElementById("seccionCocinero");

        if (tipo === "CAJERO") {
            cajero.style.display = "block";
            cocinero.style.display = "none";
        } else if (tipo === "COCINERO") {
            cajero.style.display = "none";
            cocinero.style.display = "block";
        } else {
            cajero.style.display = "none";
            cocinero.style.display = "none";
        }
    }

    window.addEventListener("load", function () {
        toggleCamposEspecificos();
    });
</script>

</body>
</html>
