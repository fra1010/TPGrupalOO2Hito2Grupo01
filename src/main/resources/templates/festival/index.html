<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout :: head}">
</head>

<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4"
      style="max-width: 1000px; margin-top: 70px;">

  <div class="page-header mb-3">
    <h2>Ranking de unidades</h2>

    <p class="text-muted mb-0">
      Seleccioná un festival para consultar sus unidades
      ordenadas de mayor a menor recaudación.
    </p>
  </div>

  <div class="card shadow-sm">

    <div class="card-header">
      Festivales activos
    </div>

    <div class="card-body">

      <div th:if="${#lists.isEmpty(festivales)}"
           class="alert alert-info mb-0">
        No hay festivales activos disponibles.
      </div>

      <div th:if="${!#lists.isEmpty(festivales)}"
           class="table-responsive">

        <table class="table table-striped table-hover mb-0">

          <thead class="thead-dark">
          <tr>
            <th scope="col">
              Nombre
            </th>

            <th scope="col">
              Temporada
            </th>

            <th scope="col">
              Fecha de inicio
            </th>

            <th scope="col">
              Fecha de fin
            </th>

            <th scope="col"
                class="text-center"
                sec:authorize="hasRole('ADMIN')">
              Acciones
            </th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="festival : ${festivales}">

            <td th:text="${festival.nombre}"></td>

            <td th:text="${festival.temporada}"></td>

            <td class="text-nowrap"
                th:text="${#temporals.format(festival.fechaInicio, 'dd/MM/yyyy')}">
            </td>

            <td class="text-nowrap"
                th:text="${#temporals.format(festival.fechaFin, 'dd/MM/yyyy')}">
            </td>

            <td class="text-center text-nowrap"
                sec:authorize="hasRole('ADMIN')">

              <a class="btn btn-outline-primary btn-sm"
                 th:href="@{/festival/{id}/ranking(id=${festival.idFestival})}">
                Ver ranking
              </a>

            </td>

          </tr>
          </tbody>

        </table>

      </div>

    </div>

  </div>

</main>

<footer th:replace="~{layout :: footer}"></footer>

<div th:replace="~{layout :: scripts}"></div>

</body>
</html>
