<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>

<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4"
      style="max-width: 1000px; margin-top: 70px;">

    <div class="page-header mb-3 d-flex flex-wrap
                justify-content-between align-items-center">

        <div class="mb-2">
            <h2>Ranking de unidades</h2>

            <p class="text-muted mb-0">
                Festival:
                <strong th:text="${festival.nombre}"></strong>
            </p>
        </div>

        <a th:href="@{/}"
           class="btn btn-outline-secondary mb-2">
            Volver al inicio
        </a>

    </div>

    <div class="card shadow-sm">

        <div class="card-header">
            Unidades ordenadas de mayor a menor recaudación
        </div>

        <div class="card-body">

            <div th:if="${#lists.isEmpty(unidades)}"
                 class="alert alert-info mb-0">
                Este festival no tiene unidades de venta registradas.
            </div>

            <div th:if="${!#lists.isEmpty(unidades)}"
                 class="table-responsive">

                <table class="table table-striped table-hover mb-0">

                    <thead class="thead-dark">
                    <tr>
                        <th scope="col" class="text-center">
                            Posición
                        </th>

                        <th scope="col">
                            Nombre comercial
                        </th>

                        <th scope="col">
                            Código
                        </th>

                        <th scope="col" class="text-right">
                            Recaudación
                        </th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="unidad, estado : ${unidades}">

                        <td class="text-center"
                            th:text="${estado.count}">
                        </td>

                        <td th:text="${unidad.nombre}">
                        </td>

                        <td class="text-nowrap"
                            th:text="${unidad.codigo}">
                        </td>

                        <td class="text-right text-nowrap"
                            th:text="${'$ ' + #numbers.formatDecimal(
                                recaudaciones[unidad.idUnidadVenta],
                                1, 'POINT', 2, 'COMMA')}">
                        </td>

                    </tr>
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<footer th:replace="~{layout :: footer}"></footer>

<div th:replace="~{layout :: scripts}"></div>

</body>
</html>
