<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout :: head}"></head>

<body>

<nav th:replace="~{layout :: navbarResponsable}"></nav>

<!-- Mensajes flotantes: no desplazan el contenido de la página -->
<div style="position: fixed;
            top: 75px;
            right: 20px;
            z-index: 1050;
            width: calc(100% - 40px);
            max-width: 500px;"
     aria-live="polite">

    <!-- Mensaje de operación exitosa -->
    <div th:if="${exito != null}"
         class="alert alert-success shadow"
         role="status"
         th:text="${exito}">
    </div>

    <!-- Mensaje de error -->
    <div th:if="${error != null}"
         class="alert alert-danger shadow"
         role="alert"
         th:text="${error}">
    </div>
</div>

<main class="container py-4">

    <!-- Encabezado -->
    <div class="page-header mb-3">
        <h2 th:text="${unidad.nombre}">
            Nombre de la unidad
        </h2>
    </div>

    <!-- Datos de la unidad -->
    <div class="card shadow-sm mb-4">

        <div class="card-header">
            <strong>Datos de la unidad</strong>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover mb-0">

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Código</th>
                        <th>Festival</th>
                        <th>Responsable</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr>
                        <td th:text="${unidad.idUnidadVenta}">
                            1
                        </td>

                        <td th:text="${unidad.codigo}">
                            COD-001
                        </td>

                        <td th:text="${unidad.idFestival != null
                                      ? unidad.idFestival : '—'}">
                            1
                        </td>

                        <td th:text="${unidad.responsable != null
                                      ? unidad.responsable.username : '—'}">
                            usuario
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>
        </div>
    </div>

    <!-- Empleados de la unidad -->
    <div class="card shadow-sm">

        <div class="card-header d-flex justify-content-between align-items-center">
            <strong>
                Empleados de la unidad
                (<span th:text="${unidad.empleados != null
                                  ? #lists.size(unidad.empleados) : 0}">
                    0
                </span>)
            </strong>

            <!-- Alta disponible únicamente para responsables -->
            <a class="btn btn-sm btn-success"
               th:href="@{/empleado/new}"
               sec:authorize="hasRole('RESPONSABLE')">
                Nuevo Empleado
            </a>
        </div>

        <div class="card-body">

            <div class="table-responsive"
                 th:unless="${#lists.isEmpty(unidad.empleados)}">

                <table class="table table-striped table-hover mb-0">

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre Completo</th>
                        <th>DNI</th>
                        <th>Fecha Ingreso</th>
                        <th>Rol / Puesto</th>
                        <th>Detalle Específico</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="emp : ${unidad.empleados}">

                        <td th:text="${emp.idEmpleado}"></td>

                        <td th:text="${emp.apellido + ', ' + emp.nombre}">
                        </td>

                        <td th:text="${emp.dni}"></td>

                        <td class="text-nowrap"
                            th:text="${emp.ingreso}">
                        </td>

                        <!-- Tipo de empleado -->
                        <td>
                            <span th:if="${#strings.equalsIgnoreCase(
                                              emp.tipoEmpleado, 'CAJERO')}"
                                  class="badge badge-primary">
                                Cajero
                            </span>

                            <span th:if="${#strings.equalsIgnoreCase(
                                              emp.tipoEmpleado, 'COCINERO')}"
                                  class="badge badge-info">
                                Cocinero
                            </span>
                        </td>

                        <!-- Datos específicos según el tipo -->
                        <td>
                            <span th:if="${#strings.equalsIgnoreCase(
                                              emp.tipoEmpleado, 'CAJERO')}"
                                  th:text="${'Turno: ' +
                                      (emp.turno != null
                                          ? #strings.toLowerCase(emp.turno)
                                          : 'sin asignar')}">
                            </span>

                            <div th:if="${#strings.equalsIgnoreCase(
                                             emp.tipoEmpleado, 'COCINERO')}">

                                <span th:text="${emp.categoria != null
                                          ? #strings.toLowerCase(emp.categoria)
                                          : 'sin categoría'}">
                                </span>

                                <span th:if="${not #strings.isEmpty(
                                                  emp.tareaEspecial)}"
                                      th:text="${' (' + emp.tareaEspecial + ')'}">
                                </span>
                            </div>
                        </td>

                        <!-- Consultar y modificar el estado -->
                        <td class="text-nowrap">
                            <form th:action="@{/responsable/empleados/estado/{id}(id=${emp.idEmpleado})}"
                                  method="post"
                                  class="mb-0"
                                  sec:authorize="hasRole('RESPONSABLE')">

                                <div class="form-check">
                                    <input type="checkbox"
                                           class="form-check-input"
                                           th:id="${'activo-' + emp.idEmpleado}"
                                           name="activo"
                                           value="true"
                                           th:checked="${emp.activo}"
                                           onchange="confirmarCambioEstado(this)"/>

                                    <label class="form-check-label"
                                           th:for="${'activo-' + emp.idEmpleado}"
                                           th:text="${emp.activo
                                                     ? 'Activo' : 'Inactivo'}">
                                        Activo
                                    </label>
                                </div>
                            </form>
                        </td>

                        <!-- Acciones disponibles -->
                        <td class="text-nowrap"
                            sec:authorize="hasRole('RESPONSABLE')">

                            <!-- Editar empleados activos e inactivos -->
                            <a class="btn btn-sm btn-warning"
                               th:href="@{/empleado/edit/{id}(id=${emp.idEmpleado})}">
                                Actualizar
                            </a>
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>

            <!-- Mensaje cuando no hay empleados -->
            <div th:if="${#lists.isEmpty(unidad.empleados)}"
                 class="text-center text-muted py-4">
                Esta unidad no tiene empleados asignados.
            </div>

        </div>
    </div>

</main>

<footer th:replace="~{layout :: footer}"></footer>

<div th:replace="~{layout :: scripts}"></div>

<script>
    const claveScrollEmpleados =
        "scroll-empleados:" + window.location.pathname;

    function confirmarCambioEstado(checkbox) {
        const accion = checkbox.checked ? "activar" : "desactivar";

        if (!window.confirm(
            "¿Seguro que querés " + accion + " a este empleado?")) {
            checkbox.checked = !checkbox.checked;
            return;
        }

        // Guardar la posición antes de enviar el formulario.
        sessionStorage.setItem(
            claveScrollEmpleados,
            String(window.scrollY)
        );

        checkbox.form.requestSubmit();
    }

    // Recuperar la posición después del POST y la redirección.
    window.addEventListener("load", function () {
        const posicion = sessionStorage.getItem(
            claveScrollEmpleados
        );

        if (posicion !== null) {
            sessionStorage.removeItem(claveScrollEmpleados);

            window.scrollTo({
                top: Number(posicion),
                left: 0,
                behavior: "instant"
            });
        }
    });
</script>

</body>
</html>
