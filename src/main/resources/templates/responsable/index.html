<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<nav th:replace="~{layout :: navbarResponsable}"></nav>

<main class="container py-4">

    <section class="mb-4 p-5 text-white text-center"
             style="background: linear-gradient(120deg, #2c3e50, #3498db);
                    border-radius: 20px;">

        <h1 class="font-weight-bold">
            Epicentro Gourmet
        </h1>

        <p class="mb-0">
            Consultá los festivales activos, sus temporadas
            y fechas de realización.
        </p>
    </section>

    <!-- Festivales -->
    <section class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h2 class="h5 mb-0">Festivales activos</h2>
        </div>

        <div class="card-body">

            <div th:if="${festivales == null}"
                 class="alert alert-warning mb-0">
                No se recibió el listado de festivales.
            </div>

            <div th:if="${festivales != null}">
                <p th:if="${#lists.isEmpty(festivales)}"
                   class="mb-0">
                    No hay festivales activos disponibles.
                </p>

                <div class="table-responsive"
                     th:if="${not #lists.isEmpty(festivales)}">

                    <table class="table table-striped mb-0">
                        <thead class="text-white"
                               style="background-color: #2c3e50;">
                        <tr>
                            <th>Nombre</th>
                            <th>Temporada</th>
                            <th>Fecha de inicio</th>
                            <th>Fecha de fin</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="festival : ${festivales}">
                            <td th:text="${festival.nombre}"></td>
                            <td th:text="${festival.temporada}"></td>
                            <td th:text="${festival.fechaInicio}"></td>
                            <td th:text="${festival.fechaFin}"></td>
                        </tr>
                        </tbody>
                    </table>

                </div>
            </div>

        </div>
    </section>

</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

</body>
</html>
