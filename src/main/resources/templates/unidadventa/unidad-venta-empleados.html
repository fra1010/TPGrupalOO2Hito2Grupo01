<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbarResponsable}"></nav>

<main class="container py-4">

    <!-- ============================================================ -->
    <!-- ENCABEZADO                                                    -->
    <!-- ============================================================ -->
    <div class="page-header mb-3">
        <h2 th:text="${unidad.nombre}">Nombre</h2>
    </div>

    <!-- ============================================================ -->
    <!-- DATOS DE LA UNIDAD                                            -->
    <!-- ============================================================ -->
    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <strong>Datos de la unidad</strong>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Código</th>
                        <th>Festival</th>
                        <th>Responsable</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td th:text="${unidad.idUnidadVenta}">1</td>
                        <td th:text="${unidad.codigo}">COD-001</td>
                        <td th:text="${unidad.idFestival != null ? unidad.idFestival : '—'}">1</td>
                        <td th:text="${unidad.responsable != null ? unidad.responsable.username : '—'}">usuario</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- EMPLEADOS DE LA UNIDAD                                        -->
    <!-- ============================================================ -->
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <strong>Empleados de la unidad (<span th:text="${unidad.empleados != null ? #lists.size(unidad.empleados) : 0}">0</span>)</strong>

            <!-- Agregar: lleva al formulario de alta, con la unidad ya seleccionada -->
            <a class="btn btn-sm btn-success"
               th:href="@{/unidadVenta/{id}/empleado/nuevo(id=${unidad.idUnidadVenta})}"> Nuevo Empleado</a>
        </div>

        <div class="card-body">
            <div class="table-responsive" th:unless="${#lists.isEmpty(unidad.empleados)}">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre Completo</th>
                        <th>DNI</th>
                        <th>Fecha Ingreso</th>
                        <th>Rol / Puesto</th>
                        <th>Detalle Específico</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="emp : ${unidad.empleados}">
                        <td th:text="${emp.idEmpleado}"></td>
                        <td th:text="${emp.apellido + ', ' + emp.nombre}"></td>
                        <td th:text="${emp.dni}"></td>
                        <td class="text-nowrap" th:text="${emp.ingreso}"></td>
                        <td>
                            <span th:if="${#strings.equalsIgnoreCase(emp.tipoEmpleado, 'CAJERO')}" class="badge bg-primary text-white">Cajero</span>
                            <span th:if="${#strings.equalsIgnoreCase(emp.tipoEmpleado, 'COCINERO')}" class="badge bg-info text-dark">Cocinero</span>
                        </td>
                        <td>
                            <span th:if="${#strings.equalsIgnoreCase(emp.tipoEmpleado, 'CAJERO')}" th:text="'turno: ' + ${#strings.toLowerCase(emp.turno)}"></span>
                            <span th:if="${#strings.equalsIgnoreCase(emp.tipoEmpleado, 'COCINERO')}" th:text="${#strings.toLowerCase(emp.categoria)} + ' (' + ${#strings.toLowerCase(emp.tareaEspecial)} + ')'"></span>
                        </td>
                        <td class="text-nowrap">
                            <!-- Actualizar: lleva al formulario de edición del empleado -->
                            <a class="btn btn-sm btn-warning"
                               th:href="@{/empleados/editar/{id}(id=${emp.idEmpleado})}"
                               th:attr="data-id=${emp.idEmpleado}">Actualizar</a>

                            <!-- Eliminar: POST con confirmación (th:action agrega el token CSRF) -->
                            <form class="d-inline"
                                  th:action="@{/empleados/eliminar/{id}(id=${emp.idEmpleado})}"
                                  method="post"
                                  onsubmit="return confirm('¿Seguro que querés eliminar a este empleado?');">
                                <button type="submit" class="btn btn-sm btn-danger"
                                        th:attr="data-id=${emp.idEmpleado}">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${#lists.isEmpty(unidad.empleados)}" class="text-center text-muted py-4">
                Esta unidad no tiene empleados asignados.
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
