<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Epicentro Gourmet</title>

    <link rel="stylesheet"
          th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet"
          th:href="@{/css/modern-business.css}"/>
</head>
<body>

<!-- Navbar general -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top"
     th:fragment="navbar">

    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">
            UNLA Orientación a Objetos 2
        </a>

        <button class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Abrir navegación">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/index}">
                        Inicio
                    </a>
                </li>

                <!-- Unidades de venta: visible solo para el administrador -->
                <li class="nav-item"
                    sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/unidadVenta/unidades}">
                        Unidades de venta
                    </a>
                </li>
            </ul>

            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item mr-2"
                    sec:authorize="hasAuthority('CAJERO')">
                    <a class="btn btn-primary"
                       th:href="@{/pedido/new}">
                        Nuevo Pedido
                    </a>
                </li>

                <!-- Liquidación de sueldo -->
                <li class="nav-item mr-2"
                    sec:authorize="hasRole('EMPLEADO')">
                    <a class="btn btn-primary"
                       th:href="@{/empleado/sueldo}">
                        Liquidación de sueldo
                    </a>
                </li>

                <!-- Mi Información -->
                <li class="nav-item mr-2"
                    sec:authorize="hasRole('EMPLEADO')">
                    <a class="btn btn-outline-light"
                       th:href="@{/empleado/mi-informacion}">
                        Mi Información
                    </a>
                </li>

                <li class="nav-item mr-2"
                    sec:authorize="isAnonymous()">
                    <a class="btn btn-primary"
                       th:href="@{/unidadVenta/formulariounidadventa}">
                        Registrar Unidad Venta
                    </a>
                </li>

                <!-- Visitante sin sesión -->
                <li class="nav-item"
                    sec:authorize="isAnonymous()">
                    <a class="btn btn-primary"
                       th:href="@{/login}">
                        Iniciar sesión
                    </a>
                </li>

                <!-- Usuario con sesión -->
                <li class="nav-item dropdown"
                    sec:authorize="isAuthenticated()">

                    <a class="nav-link dropdown-toggle"
                       href="#"
                       id="userDropdown"
                       role="button"
                       data-toggle="dropdown"
                       aria-haspopup="true"
                       aria-expanded="false">

                        <span sec:authentication="name">
                            Usuario
                        </span>
                    </a>

                    <div class="dropdown-menu dropdown-menu-right"
                         aria-labelledby="userDropdown">

                        <form th:action="@{/logout}" method="post">
                            <button type="submit"
                                    class="dropdown-item">
                                Cerrar sesión
                            </button>
                        </form>
                    </div>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- Navbar responsable -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top"
     th:fragment="navbarResponsable">

    <div class="container">
        <a class="navbar-brand mr-4" th:href="@{/index}">
            Epicentro Gourmet
        </a>

        <button class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarNavResponsable"
                aria-controls="navbarNavResponsable"
                aria-expanded="false"
                aria-label="Abrir navegación">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavResponsable">

            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/responsable/empleados}">
                        Empleados
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/responsable/reportes}">
                        Reportes
                    </a>
                </li>
            </ul>

            <ul class="navbar-nav" sec:authorize="isAuthenticated()">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                       href="#"
                       id="userDropdownResponsable"
                       role="button"
                       data-toggle="dropdown"
                       aria-haspopup="true"
                       aria-expanded="false">

                        <span sec:authentication="name">
                            Usuario
                        </span>
                    </a>

                    <div class="dropdown-menu dropdown-menu-right"
                         aria-labelledby="userDropdownResponsable">

                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="dropdown-item">
                                Cerrar sesión
                            </button>
                        </form>
                    </div>
                </li>
            </ul>

        </div>
    </div>
</nav>

<!-- Footer -->
<footer class="bg-dark text-white py-4" th:fragment="footer">
    <div class="container text-center">
        <p class="mb-0">
            &copy; 2026 Epicentro Gourmet — UNLA Orientación a Objetos 2
        </p>
    </div>
</footer>

<!-- Scripts -->
<div th:fragment="scripts">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</div>

</body>
</html>
