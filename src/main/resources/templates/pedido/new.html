<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
</head>

<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4" style="max-width: 800px; margin-top: 70px;">

    <div class="page-header mb-3">
        <h2>Nuevo Pedido</h2>
    </div>

    <div th:if="${error != null}"
         class="alert alert-danger"
         role="alert"
         th:text="${error}">
    </div>

    <div class="card form-card shadow-sm">
        <div class="card-body">

            <p class="mb-3">
                Unidad de venta:
                <strong th:text="${unidad.nombre}"></strong>
            </p>

            <form th:action="@{/pedido/create}"
                  th:object="${pedido}"
                  method="post">

                <input type="hidden" th:field="*{idUnidadVenta}"/>

                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert alert-danger">

                    <p class="mb-0"
                       th:each="error : ${#fields.globalErrors()}"
                       th:text="${error}">
                    </p>
                </div>

                <h5 class="mb-3 border-top pt-3">
                    Platos del pedido
                </h5>

                <div id="items-container">

                    <div class="item-row border rounded p-3 mb-3"
                         th:each="item, estado : *{items}">

                        <div class="row g-3 align-items-end">

                            <div class="col-md-7">
                                <label class="form-label">
                                    Plato
                                </label>

                                <select class="form-select"
                                        th:field="*{items[__${estado.index}__].idPlato}"
                                        required>

                                    <option value="">
                                        -- Seleccione un plato --
                                    </option>

                                    <option th:each="plato : ${platos}"
                                            th:value="${plato.idPlato}"
                                            th:text="${plato.nombre}">
                                    </option>
                                </select>

                                <div class="text-danger"
                                     th:if="${#fields.hasErrors('items[' + estado.index + '].idPlato')}"
                                     th:errors="*{items[__${estado.index}__].idPlato}">
                                </div>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">
                                    Cantidad
                                </label>

                                <input type="number"
                                       class="form-control"
                                       min="1"
                                       th:field="*{items[__${estado.index}__].cantidad}"
                                       required/>

                                <div class="text-danger"
                                     th:if="${#fields.hasErrors('items[' + estado.index + '].cantidad')}"
                                     th:errors="*{items[__${estado.index}__].cantidad}">
                                </div>
                            </div>

                            <div class="col-md-2 text-end">
                                <button type="button"
                                        class="btn btn-outline-danger"
                                        onclick="eliminarFila(this)">
                                    Eliminar
                                </button>
                            </div>

                        </div>
                    </div>
                </div>

                <div class="text-danger mb-3"
                     th:if="${#fields.hasErrors('items')}"
                     th:errors="*{items}">
                </div>

                <button type="button"
                        class="btn btn-outline-primary mb-4"
                        onclick="agregarFila()">
                    Agregar otro plato
                </button>

                <div class="pt-2 border-top">
                    <button type="submit" class="btn btn-primary">
                        Guardar pedido
                    </button>

                    <a th:href="@{/pedido}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>

            </form>
        </div>
    </div>

</main>

<footer th:replace="~{layout :: footer}"></footer>

<div th:replace="~{layout :: scripts}"></div>

<template id="item-template">
    <div class="item-row border rounded p-3 mb-3">

        <div class="row g-3 align-items-end">

            <div class="col-md-7">
                <label class="form-label">
                    Plato
                </label>

                <select class="form-select"
                        data-campo="idPlato"
                        required>

                    <option value="">
                        -- Seleccione un plato --
                    </option>

                    <option th:each="plato : ${platos}"
                            th:value="${plato.idPlato}"
                            th:text="${plato.nombre}">
                    </option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">
                    Cantidad
                </label>

                <input type="number"
                       class="form-control"
                       min="1"
                       data-campo="cantidad"
                       required/>
            </div>

            <div class="col-md-2 text-end">
                <button type="button"
                        class="btn btn-outline-danger"
                        onclick="eliminarFila(this)">
                    Eliminar
                </button>
            </div>

        </div>
    </div>
</template>

<script>
    function actualizarIndices() {
        const filas = document.querySelectorAll(
            "#items-container .item-row"
        );

        filas.forEach((fila, indice) => {
            fila.querySelectorAll("select, input").forEach(campo => {
                const propiedad = campo.dataset.campo
                    || campo.name.split(".").pop();

                campo.name = `items[${indice}].${propiedad}`;
                campo.id = `items${indice}.${propiedad}`;
            });
        });
    }

    function agregarFila() {
        const plantilla = document.getElementById("item-template");
        const nuevaFila = plantilla.content.cloneNode(true);

        document.getElementById("items-container")
            .appendChild(nuevaFila);

        actualizarIndices();
    }

    function eliminarFila(boton) {
        boton.closest(".item-row").remove();
        actualizarIndices();
    }
</script>

</body>
</html>
