<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Epicentro Gourmet</title>
</head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <!-- Presentacion del TP-->
    <div class="hero-section text-center">
        <div class="container">
            <h1>Epicentro Gourmet</h1>
            <p class="mb-4">
                Consultá los festivales activos, sus temporadas
                y fechas de realización.
            </p>
        </div>
    </div>

    <!-- Festivales activos -->
    <div class="card" th:if="${festivales != null and !festivales.isEmpty()}">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Festivales activos</h5>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Temporada</th>
                        <th>Fecha de inicio</th>
                        <th>Fecha de fin</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="festival : ${festivales}">
                        <td th:text="${festival.nombre}"></td>
                        <td th:text="${festival.temporada}"></td>
                        <td th:text="${festival.fechaInicio}"></td>
                        <td th:text="${festival.fechaFin}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Sin festivales -->
    <div class="card" th:if="${festivales == null or festivales.isEmpty()}">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Festivales activos</h5>
        </div>

        <div class="card-body">
            <p class="text-muted mb-0">
                No hay festivales activos.
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
