<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<!--  navbarCajero o navbarResponsable según tu layout -->
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header mb-3">
        <h2 class="text-center" th:text="${cierre.nombreUnidad}">Nombre de la unidad de venta</h2>
        <p class="text-muted mb-0 text-center">Cierre de caja diario</p>
    </div>

    <!-- Alerta de error si ocurre algún inconveniente -->
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">
        Mensaje de error
    </div>

    <!-- Formulario para seleccionar la fecha a consultar (alineado al estilo limpio del sistema) -->
    <form method="get" th:action="@{/empleado/cierre-caja}" class="row g-3 mb-4 justify-content-center align-items-end">
        <div class="col-auto">
            <label for="fecha" class="form-label fw-bold">Fecha del Cierre:</label>
            <input type="date" id="fecha" name="fecha" class="form-control" th:value="${fechaSeleccionada}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Consultar</button>
        </div>
    </form>

    <!-- Tabla de resumen de cierre (armonizada con la tabla de costos) -->
    <div class="card shadow-sm border-0 mb-4" th:if="${cierre != null}">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Concepto</th>
                    <th class="text-end">Detalle / Cantidad</th>
                    <th class="text-end">Subtotal</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>Fecha consultada</td>
                    <td class="text-end" th:text="${cierre.fecha}">YYYY-MM-DD</td>
                    <td class="text-end">-</td>
                </tr>
                <tr>
                    <td>Total de pedidos realizados</td>
                    <td class="text-end" th:text="${cierre.cantidadPedidos}">0</td>
                    <td class="text-end">-</td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <th colspan="2" class="text-end">Total recaudado</th>
                    <th class="text-end text-success" th:text="'$ ' + ${#numbers.formatDecimal(cierre.totalRecaudado,1,'POINT',2,'COMMA')}"></th>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <!-- Botón de navegación para volver -->
    <div class="d-flex justify-content-start mt-3">
        <a th:href="@{/empleado/mi-informacion}" class="btn btn-secondary">Volver</a>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
