<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header d-flex justify-content-between align-items-center mb-3">
        <h2>Gestion de Empleados</h2>
        <a th:href="@{/empleado/new}" class="btn btn-success">+ Nuevo Empleado</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre Completo</th>
                        <th>DNI</th>
                        <th>Fecha Ingreso</th>
                        <th>Rol / Puesto</th>
                        <th>Detalle Especifico</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="emp : ${empleados}">
                        <td th:text="${emp.idEmpleado}"></td>
                        <td th:text="${emp.apellido + ', ' + emp.nombre}"></td>
                        <td th:text="${emp.dni}"></td>
                        <td th:text="${emp.ingreso}"></td>
                        <td>
                            <span th:if="${emp instanceof T(com.unla.TPGrupalOO2Hito2Grupo01.entities.Cajero)}" class="badge bg-primary text-white">Cajero</span>
                            <span th:if="${emp instanceof T(com.unla.TPGrupalOO2Hito2Grupo01.entities.Cocinero)}" class="badge bg-info text-dark">Cocinero</span>
                        </td>
                        <td>
                            <span th:if="${emp instanceof T(com.unla.TPGrupalOO2Hito2Grupo01.entities.Cajero)}" th:text="'Turno: ' + ${emp.turno}"></span>
                            <span th:if="${emp instanceof T(com.unla.TPGrupalOO2Hito2Grupo01.entities.Cocinero)}" th:text="${emp.categoria} + ' (' + ${emp.tareaEspecial} + ')'"></span>
                        </td>
                        <td>
                            <!-- Enlace dinamico al metodo de edicion del controlador simplificado -->
                            <a th:href="@{/empleado/edit/{id}(id=${emp.idEmpleado})}" class="btn btn-warning btn-sm">Editar</a>
                            <!-- Enlace dinamico al metodo de baja logica -->
                            <a th:href="@{/empleado/delete/{id}(id=${emp.idEmpleado})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro desea eliminar este empleado?')">Eliminar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${empleados == null or empleados.isEmpty()}" class="text-center text-muted py-4">
                No hay empleados registrados activos en el sistema.
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
