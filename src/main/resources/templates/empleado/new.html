<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4" style="max-width: 700px;">
    <div class="page-header mb-3">
        <h2 th:text="${empleado.idEmpleado != null} ? 'Editar Empleado' : 'Nuevo Empleado'">Nuevo Empleado</h2>
    </div>

    <!-- Alerta para capturar excepciones de DNI repetido activo -->
    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card form-card shadow-sm">
        <div class="card-body">
            <form th:action="@{/empleado/create}" th:object="${empleado}" method="post">

                <!-- Campo oculto indispensable para procesar actualizaciones (Edicion) -->
                <input type="hidden" th:field="*{idEmpleado}" />

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required placeholder="Ingrese el nombre"/>
                </div>

                <div class="mb-3">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required placeholder="Ingrese el apellido"/>
                </div>

                <div class="mb-3">
                    <label for="dni" class="form-label">DNI</label>
                    <input type="number" class="form-control" id="dni" th:field="*{dni}" required placeholder="Ingrese el DNI"/>
                </div>

                <div class="mb-3">
                    <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                    <input type="date" class="form-control" id="fechaNacimiento" th:field="*{fechaNacimiento}" required/>
                </div>

                <div class="mb-3">
                    <label for="ingreso" class="form-label">Fecha de Ingreso</label>
                    <input type="date" class="form-control" id="ingreso" th:field="*{ingreso}" required/>
                </div>

                <!-- Input de control interno para el estado del registro -->
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="activo" th:field="*{activo}"/>
                    <label class="form-check-label" for="activo">¿Esta Activo?</label>
                </div>

                <!-- Selector de Tipo para Herencia -->
                <div class="mb-3 border-top pt-3">
                    <label for="tipoEmpleado" class="form-label fw-bold">Tipo de Empleado</label>
                    <select class="form-select form-control" id="tipoEmpleado" th:field="*{tipoEmpleado}" required onchange="toggleCamposEspecificos()">
                        <option value="">-- Seleccione un tipo --</option>
                        <option value="CAJERO">Cajero</option>
                        <option value="COCINERO">Cocinero</option>
                    </select>
                </div>

                <!-- Seccion Dinamica: Cajero -->
                <div id="seccionCajero" style="display: none;" class="mb-3 p-3 bg-light rounded">
                    <label for="turno" class="form-label">Turno Asignado</label>
                    <select class="form-select form-control" id="turno" th:field="*{turno}">
                        <option value="">-- Seleccione Turno --</option>
                        <option th:each="t : ${turnos}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>

                <!-- Seccion Dinamica: Cocinero -->
                <div id="seccionCocinero" style="display: none;" class="p-3 bg-light rounded mb-3">
                    <div class="mb-3">
                        <label for="categoria" class="form-label">Categoria de Cocina</label>
                        <select class="form-select form-control" id="categoria" th:field="*{categoria}">
                            <option value="">-- Seleccione Categoria --</option>
                            <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="tareaEspecial" class="form-label">Tarea Especial</label>
                        <input type="text" class="form-control" id="tareaEspecial" th:field="*{tareaEspecial}" placeholder="Ej: Especialista en minutas"/>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="btn btn-primary">Guardar Empleado</button>
                    <a th:href="@{/empleado}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

<script>
    function toggleCamposEspecificos() {
        var tipo = document.getElementById("tipoEmpleado").value;
        var cajero = document.getElementById("seccionCajero");
        var cocinero = document.getElementById("seccionCocinero");

        if (tipo === "CAJERO") {
            cajero.style.display = "block";
            cocinero.style.display = "none";
        } else if (tipo === "COCINERO") {
            cajero.style.display = "none";
            cocinero.style.display = "block";
        } else {
            cajero.style.display = "none";
            cocinero.style.display = "none";
        }
    }

    window.onload = function() {
        toggleCamposEspecificos();
    };
</script>
</body>
</html>
