<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h2>Gestión de Empleados</h2>
        <a th:href="@{/empleado/new}" class="btn btn-success">+ Nuevo Empleado</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre Completo</th>
                        <th>DNI</th>
                        <th>Fecha Ingreso</th>
                        <th>Rol / Puesto</th> <!-- Nueva columna -->
                        <th>Detalle Específico</th> <!-- Nueva columna -->
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Recorremos la lista polimórfica que envía el EmpleadoController -->
                    <tr th:each="emp : ${empleados}">
                        <td th:text="${emp.idEmpleado}"></td>
                        <!-- Combinamos nombre y apellido en una sola celda para que quede más pro -->
                        <td th:text="${emp.apellido + ', ' + emp.nombre}"></td>
                        <td th:text="${emp.dni}"></td>
                        <td th:text="${emp.ingreso}"></td>

                        <!-- Renderizado condicional según el tipo real del objeto -->
                        <td>
                            <span th:if="${emp instanceof T(com.unla.TPGrupalOO2Hito2Grupo01.entities.Cajero)}" class="badge bg-primary text-white">Cajero</span>
                            <span th:if="${emp instanceof T(com.unla.TPGrupalOO2Hito2Grupo01.entities.Cocinero)}" class="badge bg-info text-dark">Cocinero</span>
                        </td>

                        <td>
                            <!-- Si es Cajero, mostramos su Turno -->
                            <span th:if="${emp instanceof T(com.unla.TPGrupalOO2Hito2Grupo01.entities.Cajero)}"
                                  th:text="'Turno: ' + ${emp.turno}"></span>

                            <!-- Si es Cocinero, mostramos su Categoría y Tarea -->
                            <span th:if="${emp instanceof T(com.unla.TPGrupalOO2Hito2Grupo01.entities.Cocinero)}"
                                  th:text="${emp.categoria} + ' (' + ${emp.tareaEspecial} + ')'"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Mensaje por si la lista viene vacía -->
            <div th:if="${empleados == null or empleados.isEmpty()}" class="text-center text-muted py-4">
                No hay empleados registrados activos en el sistema.
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
