<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header">
        <h2 th:text="${empleado.idEmpleado != null} ? 'Editar Empleado' : 'Nuevo Empleado'">Nuevo Empleado</h2>
    </div>

    <div class="card form-card">
        <div class="card-body">
            <form th:action="@{/empleado/create}" th:object="${empleado}" method="post">

                <!-- ID oculto por si es edicion -->
                <input type="hidden" th:field="*{idEmpleado}" />

                <!-- SECTOR COMÚN -->
                <div class="mb-3">
                    <label for="nombre" class="col-form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required placeholder="Ingrese el nombre"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label for="apellido" class="col-form-label">Apellido</label>
                    <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required placeholder="Ingrese el apellido"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
                </div>

                <div class="mb-3">
                    <label for="dni" class="col-form-label">DNI</label>
                    <input type="number" class="form-control" id="dni" th:field="*{dni}" required placeholder="Ingrese el DNI"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
                </div>

                <div class="mb-3">
                    <label for="fechaNacimiento" class="col-form-label">Fecha de Nacimiento</label>
                    <input type="date" class="form-control" id="fechaNacimiento" th:field="*{fechaNacimiento}" required/>
                    <div class="text-danger" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
                </div>

                <div class="mb-3">
                    <label for="ingreso" class="col-form-label">Fecha de Ingreso</label>
                    <input type="date" class="form-control" id="ingreso" th:field="*{ingreso}" required/>
                    <div class="text-danger" th:if="${#fields.hasErrors('ingreso')}" th:errors="*{ingreso}"></div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="activo" th:field="*{activo}"/>
                    <label class="form-check-label" for="activo">¿Está Activo?</label>
                </div>

                <!-- SELECTOR DE ROL / HERENCIA -->
                <div class="mb-3 border-top pt-3">
                    <label for="tipoEmpleado" class="col-form-label fw-bold">Tipo de Empleado</label>
                    <select class="form-select form-control" id="tipoEmpleado" th:field="*{tipoEmpleado}" required onchange="toggleCamposEspecificos()">
                        <option value="">-- Seleccione un tipo --</option>
                        <option value="CAJERO">Cajero</option>
                        <option value="COCINERO">Cocinero</option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('tipoEmpleado')}" th:errors="*{tipoEmpleado}"></div>
                </div>

                <!-- SECCION EXCLUSIVA DE CAJERO -->
                <div id="seccionCajero" style="display: none;" class="mb-3 p-3 bg-light rounded">
                    <label for="turno" class="col-form-label">Turno Asignado</label>
                    <select class="form-select form-control" id="turno" th:field="*{turno}">
                        <option value="">-- Seleccione Turno --</option>
                        <option th:each="t : ${turnos}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>

                <!-- SECCION EXCLUSIVA DE COCINERO -->
                <div id="seccionCocinero" style="display: none;" class="p-3 bg-light rounded">
                    <div class="mb-3">
                        <label for="categoria" class="col-form-label">Categoría de Cocina</label>
                        <select class="form-select form-control" id="categoria" th:field="*{categoria}">
                            <option value="">-- Seleccione Categoría --</option>
                            <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="tareaEspecial" class="col-form-label">Tarea Especial</label>
                        <input type="text" class="form-control" id="tareaEspecial" th:field="*{tareaEspecial}" placeholder="Ej: Especialista en Pastas, Parrilla, etc."/>
                    </div>
                </div>

                <!-- BOTONES DE ACCIÓN -->
                <div class="d-flex mt-4">
                    <button type="submit" class="btn btn-success mr-2" th:text="${empleado.idEmpleado != null} ? 'Guardar Cambios' : 'Crear'"></button>
                    <a th:href="@{/empleado}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

<!-- SCRIPT DE ANIMACIÓN DINAMICA -->
<script>
    function toggleCamposEspecificos() {
        var tipo = document.getElementById("tipoEmpleado").value;
        var divCajero = document.getElementById("seccionCajero");
        var divCocinero = document.getElementById("seccionCocinero");

        if (tipo === "CAJERO") {
            divCajero.style.display = "block";
            divCocinero.style.display = "none";
        } else if (tipo === "COCINERO") {
            divCajero.style.display = "none";
            divCocinero.style.display = "block";
        } else {
            divCajero.style.display = "none";
            divCocinero.style.display = "none";
        }
    }

    // Ejecutar al cargar la página por si viene de una validación fallida
    document.addEventListener("DOMContentLoaded", function() {
        toggleCamposEspecificos();
    });
</script>
</body>
</html>
