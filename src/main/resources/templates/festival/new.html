<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo festival</title>
</head>
<body>

<h1>Nuevo festival</h1>

<form th:action="@{/festival/create}"
      th:object="${festival}"
      method="post">

    <!-- Para errores generales -->
    <div th:if="${#fields.hasGlobalErrors()}">
        <p th:each="error : ${#fields.globalErrors()}"
           th:text="${error}">
        </p>
    </div>

    <div>
        <label for="nombre">Nombre:</label>
        <input id="nombre"
               type="text"
               th:field="*{nombre}">
        <small th:if="${#fields.hasErrors('nombre')}"
               th:errors="*{nombre}">
        </small>
    </div>

    <div>
        <label for="temporada">Temporada:</label>
        <input id="temporada"
               type="text"
               th:field="*{temporada}">
        <small th:if="${#fields.hasErrors('temporada')}"
               th:errors="*{temporada}">
        </small>
    </div>

    <div>
        <label for="fechaInicio">Fecha de inicio:</label>
        <input id="fechaInicio"
               type="date"
               th:field="*{fechaInicio}">
        <small th:if="${#fields.hasErrors('fechaInicio')}"
               th:errors="*{fechaInicio}">
        </small>
    </div>

    <div>
        <label for="fechaFin">Fecha de fin:</label>
        <input id="fechaFin"
               type="date"
               th:field="*{fechaFin}">
        <small th:if="${#fields.hasErrors('fechaFin')}"
               th:errors="*{fechaFin}">
        </small>
    </div>

    <h2>Costos</h2>

    <div>
        <label for="costoSuperficies">Costo por superficies:</label>
        <input id="costoSuperficies"
               type="number"
               step="0.01"
               min="0"
               th:field="*{costoSuperficies}">
        <small th:if="${#fields.hasErrors('costoSuperficies')}"
               th:errors="*{costoSuperficies}">
        </small>
    </div>

    <div>
        <label for="costoMontaje">Costo de montaje:</label>
        <input id="costoMontaje"
               type="number"
               step="0.01"
               min="0"
               th:field="*{costoMontaje}">
        <small th:if="${#fields.hasErrors('costoMontaje')}"
               th:errors="*{costoMontaje}">
        </small>
    </div>

    <div>
        <label for="plusElectricidad">Plus electricidad:</label>
        <input id="plusElectricidad"
               type="number"
               step="0.01"
               min="0"
               th:field="*{plusElectricidad}">
        <small th:if="${#fields.hasErrors('plusElectricidad')}"
               th:errors="*{plusElectricidad}">
        </small>
    </div>

    <div>
        <label for="sueldoBase">Sueldo base:</label>
        <input id="sueldoBase"
               type="number"
               step="0.01"
               min="0"
               th:field="*{sueldoBase}">
        <small th:if="${#fields.hasErrors('sueldoBase')}"
               th:errors="*{sueldoBase}">
        </small>
    </div>

    <div>
        <label for="plusAntiguedad">Plus antigüedad:</label>
        <input id="plusAntiguedad"
               type="number"
               step="0.01"
               min="0"
               th:field="*{plusAntiguedad}">
        <small th:if="${#fields.hasErrors('plusAntiguedad')}"
               th:errors="*{plusAntiguedad}">
        </small>
    </div>

    <div>
        <label for="plusCocinero">Plus cocinero:</label>
        <input id="plusCocinero"
               type="number"
               step="0.01"
               min="0"
               th:field="*{plusCocinero}">
        <small th:if="${#fields.hasErrors('plusCocinero')}"
               th:errors="*{plusCocinero}">
        </small>
    </div>

    <div>
        <label for="plusAyudante">Plus ayudante:</label>
        <input id="plusAyudante"
               type="number"
               step="0.01"
               min="0"
               th:field="*{plusAyudante}">
        <small th:if="${#fields.hasErrors('plusAyudante')}"
               th:errors="*{plusAyudante}">
        </small>
    </div>

    <div>
        <label for="plusLavaplatos">Plus lavaplatos:</label>
        <input id="plusLavaplatos"
               type="number"
               step="0.01"
               min="0"
               th:field="*{plusLavaplatos}">
        <small th:if="${#fields.hasErrors('plusLavaplatos')}"
               th:errors="*{plusLavaplatos}">
        </small>
    </div>

    <button type="submit">Guardar festival</button>

    <a th:href="@{/festival}">Cancelar</a>
</form>

</body>
</html>
